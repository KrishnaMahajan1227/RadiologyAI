    <meta name="google-site-verification" content="OEn8CnZg-qteOUXkTed1J7pcXggrqoNvhVnIjG7cJ2k" />

    <!-- Canonical-domain safety net: the app is also reachable at the
         raw Vercel preview domain (radiology-ai-psi.vercel.app). Having
         the same content live and crawlable on two different hosts splits
         ranking signals and can look like duplicate content to Google, so
         this sends any visit on the vercel.app host to the real domain
         before anything else runs. The primary fix is the 301 in
         vercel.json; this is just a backup in case that host is ever hit
         directly without going through that redirect. -->
    <script>
      (function () {
        if (window.location.hostname === 'radiology-ai-psi.vercel.app') {
          window.location.replace('https://radai.alottt.com' + window.location.pathname + window.location.search);
        }
      })();
    </script>

    <!-- FAQ structured data — must always match the visible FAQ section text exactly -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What exactly does RadAI Copilot generate for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You dictate or type the clinical findings; the copilot returns a structured draft report with technique, clinical information, findings and impression already organized. You review, edit anything that needs a human judgment call, and finalize — it drafts, you sign."
          }
        },
        {
          "@type": "Question",
          "name": "Do I still need to review the report before it goes out?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, always. RadAI Copilot is a drafting and consistency-checking tool for the reporting radiologist — it is not a substitute for clinical judgment or final sign-off. Every report stays in draft until you review and approve it."
          }
        },
        {
          "@type": "Question",
          "name": "Which imaging types does it work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is built around free-text findings, which makes it modality-agnostic in practice — radiologists use it for CT, MRI, X-ray, ultrasound, mammography and more. Templates can be tailored to whichever protocols your practice reports most."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use my hospital's letterhead on the final report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Add your hospital or practice letterhead and logo once in Settings, and every finalized PDF export carries it automatically."
          }
        },
        {
          "@type": "Question",
          "name": "Does it connect to my PACS or RIS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not yet as a direct integration — today RadAI Copilot is a standalone reporting workspace: you bring the findings (typed or dictated) and take away a finalized, letterhead-ready PDF."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after my free reports run out?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every account starts with 10 free AI-generated reports, no card required. After that, individual radiologists move to the Pro plan for unlimited reports, templates and macros. Practices and imaging centres needing multiple seats can reach out for a custom Enterprise arrangement."
          }
        },
        {

          "acceptedAnswer": {

            "text": "RadAI Copilot is built and operated by Alottt.com. You can reach the team directly at hello@alottt.com or +91 70382 55944 for onboarding, billing or technical questions."
          }
        }
